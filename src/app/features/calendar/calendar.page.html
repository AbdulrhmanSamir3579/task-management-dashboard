<div class="calendar">
  <app-calendar-toolbar
    [view]="activeView()"
    [label]="label()"
    (viewChange)="changeView($event)"
    (previous)="step(-1)"
    (next)="step(1)"
    (goToToday)="goToToday()"
  />

  @if (!store.hasLoaded() && store.loadError(); as error) {
    <app-empty-state icon="⚠️" [title]="'CALENDAR.LOAD_ERROR' | translate" [message]="error">
      <ui-button [label]="'COMMON.TRY_AGAIN' | translate" (clicked)="store.reload()" />
    </app-empty-state>
  } @else if (!store.hasLoaded()) {
    <div role="status" [attr.aria-label]="'CALENDAR.LOADING' | translate">
      <ui-skeleton height="30rem" borderRadius="8px" />
    </div>
  } @else {
    @switch (activeView()) {
      @case ('week') {
        <app-week-view
          [days]="days()"
          [locale]="locale()"
          (taskOpen)="editor.openEdit($event)"
          (dayAdd)="addTask($event)"
        />
      }
      @case ('agenda') {
        @if (agenda().length) {
          <app-agenda-list
            [groups]="agenda()"
            [today]="today()"
            [locale]="locale()"
            (taskOpen)="editor.openEdit($event)"
          />
        } @else {
          <app-empty-state
            icon="🎉"
            [title]="'CALENDAR.NOTHING_DUE' | translate"
            [message]="'CALENDAR.ALL_DONE' | translate"
          >
            <ui-button [label]="'COMMON.NEW_TASK' | translate" (clicked)="editor.openCreate()" />
          </app-empty-state>
        }
      }
      @default {
        <app-month-view
          [weeks]="weeks()"
          [weekdays]="weekdays()"
          [locale]="locale()"
          (taskOpen)="editor.openEdit($event)"
          (dayAdd)="addTask($event)"
          (dayShow)="showDay($event)"
        />
      }
    }
  }
</div>
