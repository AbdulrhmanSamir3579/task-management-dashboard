@if (!store.hasLoaded() && store.loadError(); as error) {
  <app-empty-state icon="⚠️" [title]="'ANALYTICS.LOAD_ERROR' | translate" [message]="error">
    <ui-button [label]="'COMMON.TRY_AGAIN' | translate" (clicked)="store.reload()" />
  </app-empty-state>
} @else {
  <div class="analytics">
    <app-chart-card
      [heading]="'ANALYTICS.BY_STATUS' | translate"
      [description]="'ANALYTICS.BY_STATUS_HINT' | translate"
    >
      @if (charts(); as c) {
        <ui-chart [label]="'ANALYTICS.BY_STATUS' | translate" [config]="c.status" />
      } @else {
        <ng-container [ngTemplateOutlet]="loading" />
      }
    </app-chart-card>

    <app-chart-card
      [heading]="'ANALYTICS.BY_PRIORITY' | translate"
      [description]="'ANALYTICS.BY_PRIORITY_HINT' | translate"
    >
      @if (charts(); as c) {
        <ui-chart [label]="'ANALYTICS.BY_PRIORITY' | translate" [config]="c.priority" />
      } @else {
        <ng-container [ngTemplateOutlet]="loading" />
      }
    </app-chart-card>

    <app-chart-card
      [heading]="'ANALYTICS.WORKLOAD' | translate"
      [description]="'ANALYTICS.WORKLOAD_HINT' | translate"
    >
      @if (charts(); as c) {
        <ui-chart [label]="'ANALYTICS.WORKLOAD' | translate" [config]="c.workload" />
      } @else {
        <ng-container [ngTemplateOutlet]="loading" />
      }
    </app-chart-card>

    <app-chart-card
      [heading]="'ANALYTICS.TREND' | translate"
      [description]="'ANALYTICS.TREND_HINT' | translate"
    >
      @if (charts(); as c) {
        <ui-chart
          [label]="'ANALYTICS.TREND_LABEL' | translate"
          [emptyMessage]="'ANALYTICS.TREND_EMPTY' | translate"
          [config]="c.trend"
        />
      } @else {
        <ng-container [ngTemplateOutlet]="loading" />
      }
    </app-chart-card>
  </div>
}

<ng-template #loading>
  <div role="status" [attr.aria-label]="'ANALYTICS.LOADING_CHART' | translate">
    <ui-skeleton height="18rem" borderRadius="8px" />
  </div>
</ng-template>
