<form class="filter-bar" [formGroup]="form">
  <!-- PrimeNG's dropdowns are not needed for the first paint of the board. -->
  @defer (on idle) {
    <ui-form-field
      [label]="'FILTERS.PRIORITY' | translate"
      [labelVisible]="false"
      [control]="form.controls.priorities"
    >
      <ui-multi-select
        formControlName="priorities"
        [placeholder]="'FILTERS.ALL_PRIORITIES' | translate"
        [compact]="true"
        [options]="priorityOptions()"
      />
    </ui-form-field>
    <ui-form-field
      [label]="'FILTERS.ASSIGNEE' | translate"
      [labelVisible]="false"
      [control]="form.controls.assigneeId"
    >
      <ui-select
        formControlName="assigneeId"
        [placeholder]="'FILTERS.ALL_ASSIGNEES' | translate"
        [options]="assignees()"
        [clearable]="true"
        [searchable]="true"
      />
    </ui-form-field>
  } @placeholder {
    <ui-select-placeholder
      class="filter-bar__field"
      [text]="placeholders().priorities"
      [empty]="placeholders().noPriorities"
    />
    <ui-select-placeholder
      class="filter-bar__field"
      [text]="placeholders().assignee"
      [empty]="placeholders().noAssignee"
    />
  }
</form>
