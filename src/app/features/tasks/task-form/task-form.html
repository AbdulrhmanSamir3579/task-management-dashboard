<form class="task-form" novalidate [formGroup]="form" (ngSubmit)="submit()">
  <ui-form-field
    label="Title"
    [control]="form.controls.title"
    [hint]="form.controls.title.pending ? 'Checking the title…' : undefined"
  >
    <ui-input-text
      formControlName="title"
      placeholder="What needs to be done?"
      [maxLength]="limits.title"
    />
  </ui-form-field>

  <ui-form-field label="Description" [control]="form.controls.description" hint="Optional">
    <ui-textarea
      formControlName="description"
      placeholder="Add details"
      [rows]="3"
      [maxLength]="limits.description"
    />
  </ui-form-field>

  <div class="task-form__row">
    <ui-form-field label="Status" [control]="form.controls.status">
      <ui-select formControlName="status" [options]="statusOptions" />
    </ui-form-field>
    <ui-form-field label="Priority" [control]="form.controls.priority">
      <ui-select formControlName="priority" [options]="priorityOptions" />
    </ui-form-field>
  </div>

  <div class="task-form__row">
    <ui-form-field label="Due date" [control]="form.controls.dueDate">
      <ui-date-picker
        formControlName="dueDate"
        placeholder="Pick a date"
        [minDate]="minDueDate()"
      />
    </ui-form-field>
    <ui-form-field
      label="Assignee"
      [control]="form.controls.assigneeId"
      [messages]="{ required: 'Choose who will work on this task.' }"
    >
      <ui-select
        formControlName="assigneeId"
        placeholder="Choose a person"
        [options]="assignees()"
        [searchable]="true"
      />
    </ui-form-field>
  </div>

  @if (showCompletedOn() && completedOn; as completedOnControl) {
    <ui-form-field label="Completed on" [control]="completedOnControl">
      <ui-date-picker formControlName="completedOn" />
    </ui-form-field>
  }

  <ui-form-field
    label="Tags"
    [control]="form.controls.tags"
    [hint]="'Press Enter or comma to add a tag, up to ' + limits.tags"
  >
    <ui-tags-input formControlName="tags" placeholder="Add a tag" [max]="limits.tags" />
  </ui-form-field>

  <div class="task-form__actions">
    <ui-button label="Cancel" variant="ghost" [disabled]="saving()" (clicked)="cancelled.emit()" />
    <ui-button
      type="submit"
      [label]="task() ? 'Save changes' : 'Create task'"
      [loading]="saving()"
    />
  </div>
</form>
