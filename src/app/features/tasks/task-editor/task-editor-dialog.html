<ui-dialog
  width="40rem"
  [heading]="task() ? 'Edit task' : 'New task'"
  [dismissable]="!saving()"
  [beforeClose]="confirmDiscard"
  [visible]="editor.open()"
  (visibleChange)="onVisibleChange($event)"
>
  @if (editor.open()) {
    <app-task-form
      [task]="task()"
      [defaultAssigneeId]="editor.assigneeId()"
      [defaultDueDate]="editor.dueDate()"
      [assignees]="users.options()"
      [saving]="saving()"
      [isTitleTaken]="isTitleTaken"
      (saved)="save($event)"
      (cancelled)="cancel()"
    />
  }
</ui-dialog>
