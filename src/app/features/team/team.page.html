@if (loadFailed()) {
  <app-empty-state
    icon="⚠️"
    [title]="'TEAM.LOAD_ERROR' | translate"
    [message]="'TEAM.LOAD_ERROR_MESSAGE' | translate"
  >
    <ui-button [label]="'COMMON.TRY_AGAIN' | translate" (clicked)="retry()" />
  </app-empty-state>
} @else if (members(); as list) {
  @if (list.length) {
    <p class="team__summary">{{ summary() }}</p>
    <ul class="team__grid">
      @for (member of list; track member.user.id) {
        <li>
          <app-member-card [member]="member" (assign)="assignTo($event)" />
        </li>
      }
    </ul>
  } @else {
    <app-empty-state
      icon="👥"
      [title]="'TEAM.EMPTY_TITLE' | translate"
      [message]="'TEAM.EMPTY_MESSAGE' | translate"
    />
  }
} @else {
  <ul class="team__grid" role="status" [attr.aria-label]="'TEAM.LOADING' | translate">
    @for (skeleton of skeletons; track skeleton) {
      <li class="team__skeleton">
        <ui-skeleton shape="circle" width="2.5rem" height="2.5rem" />
        <ui-skeleton width="60%" height="1rem" />
        <ui-skeleton height="3.5rem" />
        <ui-skeleton height="0.5rem" />
      </li>
    }
  </ul>
}
