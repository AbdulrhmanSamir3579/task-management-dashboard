<p-drawer
  appendTo="body"
  position="right"
  ariaCloseLabel="Close panel"
  [(visible)]="visible"
  [modal]="true"
  [blockScroll]="true"
  [style]="{ width: width(), maxWidth: '100vw' }"
  [pt]="passThrough"
  (onHide)="closed.emit()"
>
  <ng-template #header>
    <h2 class="ui-drawer__heading" [id]="headingId">{{ heading() }}</h2>
  </ng-template>
  <ng-content />
  <ng-template #footer>
    <ng-content select="[uiDrawerFooter]" />
  </ng-template>
</p-drawer>
