<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Task Management Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Plan, track and analyse team tasks with filters, a drag and drop board and live statistics."
    />
    <meta name="theme-color" content="#1976d2" />
    <script>
      // Applies a saved dark theme before the app starts, so the page does not flash light.
      // Keep in step with ThemeService (storage key and class name).
      try {
        var theme = localStorage.getItem('task-manager.theme');
        if (
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('app-dark');
        }
      } catch (error) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
