name: CI

# Lints, tests and builds every pull request and every merge to main. A merge to main is then
# published to GitHub Pages, but only if all of that passed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to a pull request cancels its run still in progress; runs on main finish, so a
# deployment is never cut off.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Git hooks are for local commits only.
  HUSKY: 0

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ESLint, plus the translation check: keys used in templates exist, no hard-coded text.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Fails below 80% coverage.
      - name: Test with coverage
        run: npm run test:ci

      - name: Publish coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # Built for GitHub Pages, so a merge to main publishes exactly what was tested. Fails
      # when a bundle exceeds the budgets in angular.json.
      - name: Build
        run: npm run build:pages

      # Starts the optimised bundle, which the unit tests do not run.
      - name: Smoke test
        run: npm run smoke

      - name: Keep the build for deployment
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/task-management-dashboard/browser

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
